name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app tests build
      - run: python tests/run_tests.py
  package-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: fetch runtime and vendored wheels (no geoip download in CI)
        run: python build/fetch_deps.py --no-geoip
      - run: python build/package.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: Spoor-package
          path: dist/
